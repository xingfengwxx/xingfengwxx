name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # 每 12 小时自动执行一次
  workflow_dispatch:          # 手动执行
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: xingfengwxx
          outputs: dist/snake.svg

      - name: Preserve stats cards in output branch
        run: |
          set -e
          mkdir -p dist

          git fetch origin output:output || true

          if git show-ref --verify --quiet refs/heads/output; then
            git show output:profile-stats.svg > dist/profile-stats.svg || rm -f dist/profile-stats.svg
            git show output:top-langs.svg > dist/top-langs.svg || rm -f dist/top-langs.svg
          fi

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
