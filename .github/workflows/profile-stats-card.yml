name: Update Profile Stats Card

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build-stats-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats SVG
        env:
          GH_USERNAME: xingfengwxx
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: profile-stats/profile-stats.svg
        run: |
          python profile-stats/generate_profile_stats.py

      - name: Generate top languages SVG
        env:
          GH_USERNAME: xingfengwxx
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: profile-stats/top-langs.svg
        run: |
          python profile-stats/generate_top_languages.py

      - name: Commit generated SVGs to default branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-stats/profile-stats.svg profile-stats/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update profile stats cards"
          git push origin HEAD:${GITHUB_REF_NAME}
